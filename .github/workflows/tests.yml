# Runs the whole test suite on Linux, macOS and Windows for every supported Python version, on each push and pull
# request. The tests that need the stand-in service use Node 22 and the public server source; nothing here spends money
# or needs a secret.
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        include:
          # GitHub's Apple-silicon Macs were at capacity twice (jobs cancelled), so macOS runs one job on each Mac pool:
          # Apple silicon (macos-latest) and Intel (macos-15-intel), oldest and newest Python.
          - { os: macos-latest, python: "3.13" }
          - { os: macos-15-intel, python: "3.9" }
          # Newer Python: free use must work; paying may not install yet (x402 needs ckzg builds), so it's tried, not required.
          - { os: ubuntu-latest, python: "3.14", experimental: true }
          - { os: windows-latest, python: "3.14", experimental: true }
    continue-on-error: ${{ matrix.experimental == true }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ccheez34/agent-referee-server
          path: server
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - name: Install (free use)
        run: python -m pip install -e ".[dev]"
      - name: Install paying (required on 3.10-3.13)
        if: matrix.python != '3.9' && matrix.experimental != true
        run: python -m pip install -e ".[dev,pay]"
      - name: Install paying (tried on newer Python)
        if: matrix.experimental == true
        continue-on-error: true
        run: python -m pip install -e ".[dev,pay]"
      - name: Test
        env:
          AGENT_REFEREE_SERVER_SRC: ${{ github.workspace }}/server/src
        run: python -m pytest -rs

  package:
    # Builds the wheel and source package exactly as a release would, and checks what's in them.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: The wheel has the code, py.typed and the license, and nothing else
        run: |
          python - <<'PY'
          import glob, zipfile
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          print("\n".join(names))
          need = ["agent_referee_client/py.typed", "agent_referee_client/verify.py", "agent_referee_client/pay.py"]
          assert all(n in names for n in need), "missing: " + str([n for n in need if n not in names])
          assert any(n.endswith("licenses/LICENSE") for n in names), "no license file"
          assert not any(n.startswith(("tests/", "scripts/")) for n in names), "tests or scripts in the wheel"
          PY
