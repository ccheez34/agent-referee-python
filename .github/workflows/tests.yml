# Runs the whole test suite on Linux, macOS and Windows for every supported Python version, on each push and pull
# request. The tests that need the stand-in service use Node 22 and the public server source; nothing here spends money
# or needs a secret.
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        include:
          # Newer Python: free use must work; paying may not install yet (x402 needs ckzg builds), so it's tried, not required.
          - { os: ubuntu-latest, python: "3.14", experimental: true }
          - { os: macos-latest, python: "3.14", experimental: true }
          - { os: windows-latest, python: "3.14", experimental: true }
    continue-on-error: ${{ matrix.experimental == true }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ccheez34/agent-referee-server
          path: server
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - name: Install (free use)
        run: python -m pip install -e ".[dev]"
      - name: Install paying (required on 3.10-3.13)
        if: matrix.python != '3.9' && matrix.experimental != true
        run: python -m pip install -e ".[dev,pay]"
      - name: Install paying (tried on newer Python)
        if: matrix.experimental == true
        continue-on-error: true
        run: python -m pip install -e ".[dev,pay]"
      - name: Test
        env:
          AGENT_REFEREE_SERVER_SRC: ${{ github.workspace }}/server/src
        run: python -m pytest -rs
